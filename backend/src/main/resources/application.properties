spring.application.name=agentflow

spring.datasource.url=jdbc:mysql://localhost:3306/agentflow_db1?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Root@1230
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.flyway.enabled=true

server.port=${PORT:8085}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5:3b}
ollama.timeout-seconds=${OLLAMA_TIMEOUT_SECONDS:60}
