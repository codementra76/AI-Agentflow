spring:
  application:
    name: agentflow-backend-test

  datasource:
    url: jdbc:h2:mem:agentflow_test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
